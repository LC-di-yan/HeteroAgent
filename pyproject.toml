# ══════════════════════════════════════════════════════════════════════
# HeteroAgent 依赖与工具链真相源（T-P0-11 打包治理）
#
# 本文件是依赖版本区间的唯一真相源；requirements.txt 是它的可安装镜像，
# 二者必须同步修改。区间规则：下界 = 开发机已验证版本，上界 = 下一大版本
# （0.x 包上界取 <1，避免语义不稳定的小版本漂移无人察觉）。
#
# 本机环境事实：Python 3.12.8（故 requires-python 上界 <3.14）。
# 本仓库不作为 wheel 分发，也不写入 [build-system]：容器与本地均以
# requirements.txt 安装运行时依赖，开发依赖走 [dependency-groups] dev。
# ══════════════════════════════════════════════════════════════════════

[project]
name = "heteroagent"
version = "0.2.0"
description = "HeteroAgent — 多智能体客服系统（LangGraph + FastAPI）"
requires-python = ">=3.12,<3.14"
dependencies = [
    # ── Web 层 ──
    "fastapi>=0.115.6,<1",
    "uvicorn[standard]>=0.48.0,<1",
    # ── 配置与校验 ──
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.1,<3",
    # ── 智能体编排 ──
    "langchain>=1.4.2,<2",
    "langchain-openai>=1.2.1,<2",
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    # ── 模型供应商 SDK ──
    "openai>=2.48.0,<3",
    # ── 记忆：短期 Redis / 长期向量库 ──
    "redis>=8.0.1,<9",
    "faiss-cpu>=1.14.2,<2",
    "numpy>=2.4.4,<3",
    # ── 上下文预算与 HTTP ──
    "tiktoken>=0.12.0,<1",
    "httpx>=0.28.1,<1",
    # ── 环境变量装载（config.py 的 .env 支持）──
    "python-dotenv>=1.0.1,<2",
    # ── 全链路追踪 ──
    "opentelemetry-api>=1.42.1,<2",
    "opentelemetry-sdk>=1.42.1,<2",
    "opentelemetry-exporter-otlp>=1.42.1,<2",
    # 0.63b1 为 beta 版本号（PEP 440 归一化为 0.63b1），上界仍取 <1
    "opentelemetry-instrumentation-fastapi>=0.63b1,<1",
]

# ── 可选后端：默认不装，按需 pip install "heteroagent[milvus]" ──
# 可选依赖不进 requirements.txt，避免容器里出现未使用的重型包。
[project.optional-dependencies]
milvus = ["pymilvus>=2.4,<4"]
rerank = ["sentence-transformers>=3,<7"]

# ── 开发依赖（PEP 735 dependency groups）──
[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=5,<6",
    "fakeredis>=2.34,<3",
    "ruff>=0.8",
]

# ══════════════════════════════════════════════════════════════════════
# 测试
#
# pythonpath = ["."] 是关键：agents/ memory/ security/ tracing/ evaluation/
# 等顶层包直接从仓库根导入（无 src/ 布局），不注入根路径时 pytest 会 ImportError。
# ══════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
testpaths = ["tests"]
# pytest-asyncio 1.x 未显式声明 fixture loop scope 会告警，按最小 surprise 定为 function
asyncio_default_fixture_loop_scope = "function"
# 轻度忽略：只屏蔽第三方库的历史告警，本仓库自身的告警照常可见
filterwarnings = [
    "ignore::DeprecationWarning:langchain.*",
    "ignore::DeprecationWarning:langchain_openai.*",
    "ignore::DeprecationWarning:mcp.*",
    "ignore::PendingDeprecationWarning",
]

# ══════════════════════════════════════════════════════════════════════
# Lint
# ══════════════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 与中文注释宽度冲突，行长交给格式化与人工审阅
ignore = ["E501"]
